[project]
name = "recon-agent"
version = "0.1.2"
description = "AI-powered reconciliation agent for finance."
authors = [{name = "Abtimist", email = "abhishek@abtimist.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "keyring>=25.0"
]

[project.optional-dependencies]
backend = [
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "faker>=20.0",
    "google-genai>=0.2",
    "python-dateutil>=2.8",
    "openai>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "supabase>=2.0",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recon_cli"]

[tool.hatch.build.targets.sdist]
include = ["recon_cli", "README.md", "pyproject.toml"]

[project.scripts]
recon = "recon_cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
